name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - name: Versions
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Upgrade dependencies
        run: dart pub upgrade
      - name: Install dependencies (example/greeter)
        # Its own project, so `dart analyze .` below cannot resolve its imports
        # until it has been resolved itself.
        run: dart pub get
        working-directory: example/greeter
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dart doc
        run: dart doc --dry-run

  test:
    # Both platforms on purpose: locating and loading libjvm is per-platform,
    # and it is the part of this package most likely to break on one and not
    # the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    env:
      # Read in a step `if:` below, which cannot see `secrets` directly. When it
      # is unset the upload is skipped rather than failing the build.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dart-lang/setup-dart@v1
      - name: Versions
        run: |
          dart --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Build the Java fixtures
        # setup-java exports JAVA_HOME, which is the first thing both
        # java_home.sh and searchLibjvm look at.
        run: ./build.sh
      - name: Run tests
        run: dart test --platform vm --coverage=./coverage
      - name: Run the examples
        # Every example, so none of them can rot unnoticed. The three JDK-only
        # ones need no class path; main.dart and the greeter need the jar built
        # in the step above. ./run.sh resolves and runs example/greeter, which
        # is its own project.
        run: |
          dart run example/jdk_apis.dart
          dart run example/collections.dart
          dart run example/performance.dart
          dart run example/main.dart
          ./run.sh
      - name: Generate coverage report
        # --base-directory makes the lcov paths repo-relative, so Codecov lines
        # them up with the source without needing a path fix.
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --packages=.dart_tool/package_config.json \
            --report-on=lib \
            --base-directory=. \
            --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        # Both platforms upload: java_home.dart branches on the OS, so the
        # merged report covers paths neither runner reaches alone.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: ${{ matrix.os }}
          env_vars: OS,DART
          fail_ci_if_error: true
          verbose: true
      - name: Codecov not configured
        if: env.CODECOV_TOKEN == ''
        run: |
          echo "::notice::CODECOV_TOKEN is not set on this repository, so the \
          coverage upload was skipped. Add it under Settings > Secrets and \
          variables > Actions to enable it."
