name: java_interop
description: >-
  Call Java from pure Dart over JNI, using only dart:ffi and no Flutter SDK.
  Boots or attaches to a JVM in-process, loads jars, and calls constructors,
  methods, fields and arrays.
version: 1.2.0

homepage: https://github.com/gmpassos/java_interop
repository: https://github.com/gmpassos/java_interop
issue_tracker: https://github.com/gmpassos/java_interop/issues

topics:
  - java
  - jni
  - ffi
  - interop
  - jvm

environment:
  sdk: ^3.10.0

dependencies:
  # Pure Dart, no Flutter. Provides the native allocator (malloc/Arena) and
  # Utf8 helpers that dart:ffi itself does not expose.
  ffi: ^2.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
